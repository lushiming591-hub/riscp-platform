name: Build deployment package

on:
  workflow_dispatch:
  push:
    branches: [development]
  pull_request:
    branches: [development]

permissions:
  contents: read

env:
  PACKAGE_NAME: riscp-platform-deployment

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: php artisan test

      - name: Prepare deployment package
        run: |
          rm -rf .git .github node_modules vendor storage/logs storage/framework/cache/* storage/framework/sessions/* storage/framework/views/*
          rm -f .env .env.*.local
          mkdir -p storage/framework/{cache,sessions,views} storage/logs
          touch storage/logs/.gitkeep
          cat > DEPLOY.md <<'EOF'
          # RISCP Platform Deployment

          ## Requirements
          - PHP 8.3+
          - Composer 2+
          - MySQL 8+
          - Redis recommended

          ## Install
          1. Copy `.env.example` to `.env`.
          2. Configure database, cache, queue and Allinpay credentials.
          3. Run `composer install --no-dev --optimize-autoloader`.
          4. Run `php artisan key:generate` if APP_KEY is empty.
          5. Run `php artisan migrate --force`.
          6. Run `php artisan config:cache`.
          7. Run `php artisan route:cache`.
          8. Start the queue worker and scheduler according to the production environment.

          ## Payment production checks
          - Verify Allinpay credentials and certificate configuration.
          - Verify callback URL is publicly reachable over HTTPS.
          - Verify callback signature validation before enabling live traffic.
          - Run one small real payment and verify PAID state and callback idempotency.
          - Run one refund and verify refund callback and final refund state.
          - Import one reconciliation file and verify matching/difference handling.
          EOF
          cd ..
          tar --exclude='riscp-platform/.git' -czf "${PACKAGE_NAME}.tar.gz" riscp-platform

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 14
